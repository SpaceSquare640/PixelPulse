name: "💡 功能建議（繁體中文）"
description: 為 PixelPulse 提出新想法或改進建議
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感謝你的建議！請描述你遇到的問題與想法，不需要先想好完整的解決方案。
  - type: textarea
    id: problem
    attributes:
      label: 這個建議想解決什麼問題？
      description: 你想做的事情，PixelPulse 目前沒辦法很好地支援？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議的解決方式
      description: 你希望它怎麼運作？
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的其他方案
    validations:
      required: false
