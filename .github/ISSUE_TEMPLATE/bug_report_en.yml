name: "🐛 Bug Report (English)"
description: Report something that isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.
  - type: input
    id: version
    attributes:
      label: PixelPulse version
      description: Shown on the Settings page, or in the installer filename.
      placeholder: v0.11.0
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running PixelPulse?
      options:
        - Installed Windows app (GUI)
        - Running from source (GUI)
        - CLI only
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / activity log output
      description: Copy anything relevant from the app's Activity page or terminal output. This will be rendered as code automatically.
      render: shell
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: false
